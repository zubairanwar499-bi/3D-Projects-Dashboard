<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>3D Product Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/style.css"/>

  <!-- Local vendor scripts with CDN fallbacks -->
  <script src="../../js/vendor/three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';"></script>
  <script src="../../js/vendor/OrbitControls.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';"></script>

  <script src="../../js/products-data.js"></script>
  <script src="../../js/sales-data.js"></script>
  <script src="../../js/shared-ui.js"></script>
  <style>
    /* Full bleed canvas — clean & immersive */
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent;
    }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
  </style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div class="loading-text">Loading 3D Model…</div></div>
<div id="tooltip"></div>
<div id="canvas-container"></div>

<script src="../../js/scene3d.js"></script>
<script>
const CAT    = getURLParam('cat') || '';
const BRAND  = getURLParam('brand') || '';
const PROD   = getURLParam('product') || '';
const REGION = getURLParam('region') || '';
const THEME  = (getURLParam('theme') || 'dark').toLowerCase();

if (THEME === 'light') {
  document.body.classList.add('light-mode');
}

function filterProducts() {
  if (typeof PRODUCTS_DATA === 'undefined') return [];
  let data = PRODUCTS_DATA;
  if (CAT && CAT.toLowerCase() !== 'all') {
    data = data.filter(p => p.category.toLowerCase() === CAT.toLowerCase());
  }
  if (BRAND && BRAND.toLowerCase() !== 'all') {
    data = data.filter(p => p.brand.toLowerCase() === BRAND.toLowerCase());
  }
  if (PROD && PROD.toLowerCase() !== 'all') {
    data = data.filter(p => p.name.toLowerCase().includes(PROD.toLowerCase()));
  }
  return data;
}

function bootShowcase() {
  try {
    if (typeof THREE === 'undefined') {
      setTimeout(bootShowcase, 100);
      return;
    }
    const scene3d = new Scene3D('canvas-container', {
      category: CAT,
      brand: BRAND,
      product: PROD,
      theme: THEME
    });
    window._scene3d = scene3d;
    scene3d.loadProducts(filterProducts());
  } catch(err) {
    console.error('Error starting 3D Showcase:', err);
  } finally {
    const l = document.getElementById('loading');
    if (l) l.classList.add('hidden');
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootShowcase);
} else {
  bootShowcase();
}
setTimeout(() => {
  const l = document.getElementById('loading');
  if (l) l.classList.add('hidden');
}, 1000);
</script>
</body>
</html>
