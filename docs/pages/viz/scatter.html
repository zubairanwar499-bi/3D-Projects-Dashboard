<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>3D Scatter Matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/style.css"/>

  <script src="../../js/vendor/three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';"></script>
  <script src="../../js/vendor/OrbitControls.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';"></script>
  <script src="../../js/products-data.js"></script>
  <script src="../../js/sales-data.js"></script>
  <script src="../../js/shared-ui.js"></script>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent;
    }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
  </style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div class="loading-text">Loading Matrix 3D…</div></div>
<div id="tooltip"></div>
<div id="canvas-container"></div>

<script>
const CAT    = getURLParam('cat') || '';
const BRAND  = getURLParam('brand') || '';
const PROD   = getURLParam('product') || '';
const REGION = getURLParam('region') || '';
const THEME  = (getURLParam('theme') || 'dark').toLowerCase();
const ROTATE = getURLParam('rotate') !== 'false';

if (THEME === 'light') {
  document.body.classList.add('light-mode');
}

let scene, camera, renderer, controls, raycaster, mouse;
let spheres = [];
let hoveredSphere = null;

function init() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth || window.innerWidth || 600;
  const h = container.clientHeight || window.innerHeight || 450;

  scene = new THREE.Scene();
  const isLight = THEME === 'light';
  const bgColor = isLight ? 0xf4f5fb : 0x0a0b14;
  scene.background = new THREE.Color(bgColor);
  scene.fog = new THREE.FogExp2(bgColor, 0.025);

  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  camera.position.set(11, 8.5, 14);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  container.appendChild(renderer.domElement);

  if (typeof THREE.OrbitControls === 'function') {
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = ROTATE;
    controls.autoRotateSpeed = 0.65;
  }

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, isLight ? 0.9 : 0.55));
  const dir = new THREE.DirectionalLight(0xffffff, isLight ? 1.2 : 1.4);
  dir.position.set(14, 22, 14);
  scene.add(dir);

  const backLight = new THREE.PointLight(isLight ? 0x99aaff : 0x6c63ff, 1.4, 35);
  backLight.position.set(-10, 8, -10);
  scene.add(backLight);

  // Coordinate Grid Base
  const grid = new THREE.GridHelper(20, 20, isLight ? 0xc4c8da : 0x333466, isLight ? 0xdcdff0 : 0x161830);
  grid.position.set(5, 0, 5);
  scene.add(grid);

  drawAxes();
  buildScatter();
  bindEvents();
  animate();

  const l = document.getElementById('loading');
  if (l) l.classList.add('hidden');
}

function drawAxes() {
  const origin = new THREE.Vector3(0, 0, 0);

  // Red X (Price)
  const xGeo = new THREE.BufferGeometry().setFromPoints([origin, new THREE.Vector3(12, 0, 0)]);
  scene.add(new THREE.Line(xGeo, new THREE.LineBasicMaterial({ color: 0xff5252, linewidth: 2 })));

  // Green Y (Rating)
  const yGeo = new THREE.BufferGeometry().setFromPoints([origin, new THREE.Vector3(0, 7, 0)]);
  scene.add(new THREE.Line(yGeo, new THREE.LineBasicMaterial({ color: 0x4caf50, linewidth: 2 })));

  // Blue Z (Units)
  const zGeo = new THREE.BufferGeometry().setFromPoints([origin, new THREE.Vector3(0, 0, 12)]);
  scene.add(new THREE.Line(zGeo, new THREE.LineBasicMaterial({ color: 0x448aff, linewidth: 2 })));

  const sX = makeTextSprite('Price →', { color: '#ff5252', bg: 'rgba(20,20,35,0.75)', width: 1.6, height: 0.35 });
  sX.position.set(12.6, 0, 0);
  scene.add(sX);

  const sY = makeTextSprite('Rating ↑', { color: '#4caf50', bg: 'rgba(20,20,35,0.75)', width: 1.6, height: 0.35 });
  sY.position.set(0, 7.5, 0);
  scene.add(sY);

  const sZ = makeTextSprite('Units →', { color: '#448aff', bg: 'rgba(20,20,35,0.75)', width: 1.6, height: 0.35 });
  sZ.position.set(0, 0, 12.6);
  scene.add(sZ);
}

function buildScatter() {
  const sales = getAggregatedSales({ category: CAT, brand: BRAND, product: PROD, region: REGION });
  if (sales.length === 0) return;

  const prodMap = {};
  if (typeof PRODUCTS_DATA !== 'undefined') {
    PRODUCTS_DATA.forEach(p => { prodMap[p.name] = p; });
  }

  const maxPrice = 800000;
  const maxUnits = Math.max(...sales.map(s => s.units)) || 1;
  const maxRev   = Math.max(...sales.map(s => s.revenue)) || 1;

  sales.forEach(s => {
    const pInfo = prodMap[s.name] || {};
    const price = pInfo.price || 100000;

    const x = Math.min(11, (price / maxPrice) * 11);
    const y = Math.max(0.6, ((s.rating - 4.1) / 0.9) * 6);
    const z = Math.min(11, (s.units / maxUnits) * 11);

    const rad = 0.22 + Math.sqrt(s.revenue / maxRev) * 0.42;
    const bColor = brandColor(s.brand);

    const geo = new THREE.SphereGeometry(rad, 24, 24);
    const mat = new THREE.MeshStandardMaterial({
      color: bColor,
      roughness: 0.2,
      metalness: 0.6,
      emissive: new THREE.Color(bColor).multiplyScalar(0.25)
    });

    const sphere = new THREE.Mesh(geo, mat);
    sphere.position.set(x, y, z);
    sphere.userData = { sales: s, product: pInfo, origColor: bColor };

    // Dropdown dashed line
    const guideGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x, 0, z),
      new THREE.Vector3(x, y, z)
    ]);
    const guideLine = new THREE.Line(guideGeo, new THREE.LineDashedMaterial({ color: 0x555888, dashSize: 0.2, gapSize: 0.1 }));
    guideLine.computeLineDistances();
    scene.add(guideLine);

    scene.add(sphere);
    spheres.push(sphere);
  });

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2(-9999, -9999);
}

function bindEvents() {
  window.addEventListener('resize', () => {
    const c = document.getElementById('canvas-container');
    camera.aspect = c.clientWidth / c.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(c.clientWidth, c.clientHeight);
  });

  const dom = renderer.domElement;
  dom.addEventListener('mousemove', e => {
    const rect = dom.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    if (hoveredSphere) {
      const s = hoveredSphere.userData.sales;
      const p = hoveredSphere.userData.product;
      const html = `
        <div class="tt-name">${s.name}</div>
        <div class="tt-row"><span class="tt-label">Brand</span><span class="tt-value">${s.brand}</span></div>
        ${REGION ? `<div class="tt-row"><span class="tt-label">Region</span><span class="tt-value">${REGION}</span></div>` : ''}
        <div class="tt-row"><span class="tt-label">Base Price</span><span class="tt-value">PKR ${(p.price || 0).toLocaleString()}</span></div>
        <div class="tt-row"><span class="tt-label">Rating</span><span class="tt-value">★ ${s.rating.toFixed(2)}</span></div>
        <div class="tt-row"><span class="tt-label">Units Sold</span><span class="tt-value">${s.units.toLocaleString()}</span></div>
        <div class="tt-price">${fmtPKR(s.revenue)}</div>
      `;
      showTooltip(html, e.clientX, e.clientY);
    }
  });

  dom.addEventListener('mouseleave', () => {
    mouse.set(-9999, -9999);
    hideTooltip();
  });
}

function animate() {
  requestAnimationFrame(animate);

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(spheres);

  if (hits.length > 0) {
    const target = hits[0].object;
    if (hoveredSphere !== target) {
      if (hoveredSphere) unhighlight(hoveredSphere);
      hoveredSphere = target;
      highlight(hoveredSphere);
    }
  } else {
    if (hoveredSphere) {
      unhighlight(hoveredSphere);
      hoveredSphere = null;
      hideTooltip();
    }
  }

  if (controls) controls.update();
  if (renderer) renderer.render(scene, camera);
}

function highlight(mesh) {
  mesh.material.emissive.setHex(0xffffff);
  mesh.material.emissiveIntensity = 0.6;
  mesh.scale.set(1.3, 1.3, 1.3);
  document.body.style.cursor = 'pointer';
}

function unhighlight(mesh) {
  mesh.material.emissive.setHex(mesh.userData.origColor);
  mesh.material.emissiveIntensity = 0.25;
  mesh.scale.set(1, 1, 1);
  document.body.style.cursor = 'default';
}

window.addEventListener('DOMContentLoaded', init);
setTimeout(() => {
  const l = document.getElementById('loading');
  if (l) l.classList.add('hidden');
}, 1000);
</script>
</body>
</html>
