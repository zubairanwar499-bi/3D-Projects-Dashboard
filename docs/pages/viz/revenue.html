<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>3D Revenue Bar Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/style.css"/>

  <script src="../../js/vendor/three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';"></script>
  <script src="../../js/vendor/OrbitControls.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';"></script>
  <script src="../../js/sales-data.js"></script>
  <script src="../../js/shared-ui.js"></script>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent;
    }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
  </style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div class="loading-text">Loading Revenue 3D…</div></div>
<div id="tooltip"></div>
<div id="canvas-container"></div>

<script>
const CAT    = getURLParam('cat') || '';
const BRAND  = getURLParam('brand') || '';
const PROD   = getURLParam('product') || '';
const REGION = getURLParam('region') || '';
const THEME  = (getURLParam('theme') || 'dark').toLowerCase();
const ROTATE = getURLParam('rotate') !== 'false';

if (THEME === 'light') {
  document.body.classList.add('light-mode');
}

let scene, camera, renderer, controls, raycaster, mouse;
let bars = [];
let hoveredBar = null;

function init() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth || window.innerWidth || 600;
  const h = container.clientHeight || window.innerHeight || 450;

  scene = new THREE.Scene();
  const isLight = THEME === 'light';
  const bgColor = isLight ? 0xf4f5fb : 0x0a0b14;
  scene.background = new THREE.Color(bgColor);
  scene.fog = new THREE.FogExp2(bgColor, 0.03);

  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  camera.position.set(0, 6, 12);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  if (typeof THREE.OrbitControls === 'function') {
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = ROTATE;
    controls.autoRotateSpeed = 0.75;
    controls.maxPolarAngle = Math.PI / 2.05;
  }

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, isLight ? 0.85 : 0.5));
  const dirLight = new THREE.DirectionalLight(0xffffff, isLight ? 1.2 : 1.5);
  dirLight.position.set(10, 18, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const fill = new THREE.PointLight(isLight ? 0x99aaff : 0x6c63ff, 1.2, 30);
  fill.position.set(-8, 6, -5);
  scene.add(fill);

  // Floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshStandardMaterial({ color: isLight ? 0xe9ecf6 : 0x05060b, roughness: 0.85, metalness: 0.15 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const grid = new THREE.GridHelper(36, 36, isLight ? 0xc4c8da : 0x222344, isLight ? 0xdcdff0 : 0x121326);
  grid.position.y = 0.01;
  scene.add(grid);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2(-9999, -9999);

  buildBars();
  bindEvents();
  animate();

  const l = document.getElementById('loading');
  if (l) l.classList.add('hidden');
}

function buildBars() {
  const list = getAggregatedSales({ category: CAT, brand: BRAND, product: PROD, region: REGION });
  if (list.length === 0) return;

  const maxRev = Math.max(...list.map(d => d.revenue)) || 1;
  const maxHeight = 5.2;
  const n = list.length;
  const cols = Math.min(n, 5);
  const rows = Math.ceil(n / cols);
  const spacingX = 2.4;
  const spacingZ = 2.4;

  list.forEach((item, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = (col - (cols - 1) / 2) * spacingX;
    const z = (row - (rows - 1) / 2) * spacingZ;

    const barHeight = Math.max(0.4, (item.revenue / maxRev) * maxHeight);
    const bColor = brandColor(item.brand);

    const geo = new THREE.BoxGeometry(0.85, barHeight, 0.85);
    geo.translate(0, barHeight / 2, 0);

    const mat = new THREE.MeshStandardMaterial({
      color: bColor,
      roughness: 0.3,
      metalness: 0.45,
      emissive: new THREE.Color(bColor).multiplyScalar(0.2)
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 0, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData = {
      item: item,
      origColor: bColor,
      barHeight: barHeight
    };

    // Top Cap Accent
    const capGeo = new THREE.BoxGeometry(0.87, 0.06, 0.87);
    const capMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const cap = new THREE.Mesh(capGeo, capMat);
    cap.position.y = barHeight + 0.03;
    mesh.add(cap);

    // Label Sprite
    const shortName = item.name.length > 13 ? item.name.substring(0, 11) + '…' : item.name;
    const sprite = makeTextSprite(shortName, {
      size: 80, width: 2.1, height: 0.42,
      bg: THEME === 'light' ? 'rgba(255,255,255,0.92)' : 'rgba(15,16,30,0.85)',
      color: THEME === 'light' ? '#111' : '#fff'
    });
    sprite.position.set(0, barHeight + 0.55, 0);
    mesh.add(sprite);

    scene.add(mesh);
    bars.push(mesh);
  });
}

function bindEvents() {
  window.addEventListener('resize', () => {
    const c = document.getElementById('canvas-container');
    camera.aspect = c.clientWidth / c.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(c.clientWidth, c.clientHeight);
  });

  const dom = renderer.domElement;
  dom.addEventListener('mousemove', e => {
    const rect = dom.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    if (hoveredBar) {
      const item = hoveredBar.userData.item;
      const html = `
        <div class="tt-name">${item.name}</div>
        <div class="tt-row"><span class="tt-label">Brand</span><span class="tt-value">${item.brand}</span></div>
        ${REGION ? `<div class="tt-row"><span class="tt-label">Region</span><span class="tt-value">${REGION}</span></div>` : ''}
        <div class="tt-row"><span class="tt-label">Units Sold</span><span class="tt-value">${item.units.toLocaleString()}</span></div>
        <div class="tt-row"><span class="tt-label">Rating</span><span class="tt-value">★ ${item.rating.toFixed(2)}</span></div>
        <div class="tt-price">${fmtPKR(item.revenue)}</div>
      `;
      showTooltip(html, e.clientX, e.clientY);
    }
  });

  dom.addEventListener('mouseleave', () => {
    mouse.set(-9999, -9999);
    hideTooltip();
  });
}

function animate() {
  requestAnimationFrame(animate);

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(bars);

  if (hits.length > 0) {
    const target = hits[0].object;
    if (hoveredBar !== target) {
      if (hoveredBar) unhighlight(hoveredBar);
      hoveredBar = target;
      highlight(hoveredBar);
    }
  } else {
    if (hoveredBar) {
      unhighlight(hoveredBar);
      hoveredBar = null;
      hideTooltip();
    }
  }

  if (controls) controls.update();
  if (renderer) renderer.render(scene, camera);
}

function highlight(mesh) {
  mesh.material.emissive.setHex(0x6c63ff);
  mesh.material.emissiveIntensity = 0.8;
  mesh.scale.set(1.08, 1.05, 1.08);
  document.body.style.cursor = 'pointer';
}

function unhighlight(mesh) {
  mesh.material.emissive.setHex(mesh.userData.origColor);
  mesh.material.emissiveIntensity = 0.2;
  mesh.scale.set(1, 1, 1);
  document.body.style.cursor = 'default';
}

window.addEventListener('DOMContentLoaded', init);
setTimeout(() => {
  const l = document.getElementById('loading');
  if (l) l.classList.add('hidden');
}, 1000);
</script>
</body>
</html>
